name: Build OBV VISUALS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Build
        run: gradle build --no-daemon
      - name: Prepare jar
        run: |
          mkdir -p dist
          cp build/libs/OBV-VISUALS-1.0.0.jar "dist/OBV VISUALS.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: OBV-VISUALS
          path: dist/OBV VISUALS.jar
